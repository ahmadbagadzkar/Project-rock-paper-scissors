<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="box-container">
        <div class="containerUtama">
            <h1 id="infoRounde">Rounde 0 / 0</h1>
            <div class="containerScore">
                <div class="ScoreContent">
                    <h2>Your Score</h2>
                    <p class="score" id="scoreHuman">0</p>
                </div>
                <div class="ScoreContent">
                    <h2>Comp Score</h2>
                    <p class="score" id="scoreComp">0</p>
                </div>
            </div>
            <div class="containerButton">
                <div class="allButton">
                    <button id="batu">Batu</button>
                    <button id="gunting">Gunting</button>
                    <button id="kertas">Kertas</button>
                </div>
                <button id="main" disabled>Main</button>
            </div>
            <div id="Choice">
                Pilihan Kamu:  
            </div>
        </div>
        <div class="containerBungkus">
            <div class="containerSamping">
                <h2>Alur Permainan</h2>
                <ol id="box">
                </ol>
            </div>
            <div class="containerHasil">
                <h2>Hasil Permainan</h2>
            </div>
            <button class="btnReset" id="btnReset">Reset Game</button>
        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
